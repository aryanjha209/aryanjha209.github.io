<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #030014;
            --purple: #a855f7;
            --cyan: #06b6d4;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            padding: 1.5rem;
        }
        .glow-orb {
            position: absolute;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            opacity: 0.18;
            z-index: 1;
        }
        .purple-glow {
            background: radial-gradient(circle, var(--purple) 0%, transparent 70%);
            top: -10vw;
            right: -10vw;
        }
        .blue-glow {
            background: radial-gradient(circle, var(--cyan) 0%, transparent 70%);
            bottom: -10vw;
            left: -10vw;
        }
        .content {
            text-align: center;
            position: relative;
            z-index: 10;
            max-width: 450px;
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--cyan) 0%, var(--purple) 100%);
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.2));
            animation: pulse 2s infinite alternate ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.06); opacity: 1; }
        }
        h1 {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--text) 30%, var(--text-dim) 100%);
            -webkit-text-fill-color: transparent;
        }
        h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }
        p {
            font-size: 0.88rem;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 2.25rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, var(--purple) 0%, #ec4899 100%);
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.8rem 1.6rem;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.25);
            transition: all 0.25s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.4);
        }
        .loader {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border-top-color: var(--cyan);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem auto;
            box-shadow: 0 0 10px var(--cyan-glow);
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .routing-text {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="glow-orb purple-glow"></div>
    <div class="glow-orb blue-glow"></div>

    <div class="content">
        <div class="loader" id="routing-loader"></div>
        <div class="routing-text" id="routing-status">Smart routing to main site...</div>
        
        <div id="error-graphics">
            <div class="icon"><i class="fa-solid fa-compass-drafting"></i></div>
            <h1>404</h1>
            <h2>Lost in Cyberspace?</h2>
            <p>The page you are looking for has either been moved, deleted, or never existed in the first place.</p>
            <a href="./index.html" class="btn">
                <i class="fa-solid fa-house"></i> Go Back Home
            </a>
        </div>
    </div>

    <script>
        // Intelligent route dispatcher
        (function() {
            const pathname = window.location.pathname.toLowerCase();
            const segments = pathname.split('/').filter(Boolean);
            
            // If the route corresponds to a section
            const validSections = ['about', 'projects', 'services', 'testimonials', 'contact'];
            
            let matchedSection = null;
            for (let segment of segments) {
                if (validSections.includes(segment)) {
                    matchedSection = segment;
                    break;
                }
            }
            
            if (matchedSection) {
                // Show loader and hide standard 404 details
                document.getElementById('routing-loader').style.display = 'block';
                document.getElementById('routing-status').style.display = 'block';
                document.getElementById('error-graphics').style.display = 'none';
                
                setTimeout(function() {
                    window.location.replace("./#" + matchedSection);
                }, 800);
            }
        })();
    </script>
</body>
</html>
