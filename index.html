<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Jha-OS - Futuristic AI-Powered Developer Workspace launching soon.">
    <meta name="theme-color" content="#4EBF15">
    <title>Jha-OS | Launching Soon</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body>
    <!-- Ambient 3D Shapes Background -->
    <div class="ambient-background">
        <canvas id="ambient-canvas"></canvas>
    </div>

    <!-- Main Container -->
    <main class="viewport">
        <!-- 3D Card Wrapper -->
        <div class="perspective-container">
            <div class="coming-soon-card" id="3d-card">
                <!-- Branding Header -->
                <div class="brand">
                    <span class="brand-logo">⚡</span>
                    <h1>Jha-OS<span>.</span></h1>
                </div>

                <!-- Launch Banner -->
                <div class="launch-badge">INITIALIZING WORKSPACE v2.0</div>

                <h2>LAUNCHING SOON</h2>
                <p class="tagline">A hardware-accelerated, AI-powered developer environment and utility suite built for the next generation of creators.</p>

                <!-- 3D Countdown Grid -->
                <div class="countdown-grid" id="countdown">
                    <div class="countdown-box">
                        <span id="days" class="number">00</span>
                        <span class="label">DAYS</span>
                    </div>
                    <div class="countdown-box">
                        <span id="hours" class="number">00</span>
                        <span class="label">HOURS</span>
                    </div>
                    <div class="countdown-box">
                        <span id="minutes" class="number">00</span>
                        <span class="label">MINS</span>
                    </div>
                    <div class="countdown-box">
                        <span id="seconds" class="number">00</span>
                        <span class="label">SECS</span>
                    </div>
                </div>

                <!-- Subscription Form -->
                <form id="subscribe-form" class="subscribe-form">
                    <div class="input-group">
                        <i class="far fa-envelope mail-icon"></i>
                        <input type="email" id="subscriber-email" placeholder="Enter your email address" required autocomplete="off">
                        <button type="submit" class="submit-btn">
                            <span class="btn-text">Notify Me</span>
                            <span class="btn-icon"><i class="fas fa-paper-plane"></i></span>
                        </button>
                    </div>
                </form>

                <!-- Feedback Message -->
                <div id="form-msg" class="form-msg"></div>

                <!-- Minimal Info Footer -->
                <footer>
                    <p>&copy; 2026 Jha-OS. All rights reserved.</p>
                </footer>
            </div>
        </div>
    </main>

    <!-- Custom Scripts -->
    <script src="script.js"></script>
</body>
</html>
